# D-OmniTwin CI Pipeline
#
# Triggert op elke PR naar main en bij directe pushes op main.
# Stap 1 (Bouwen) en Stap 3/unit (Testen) uit Issue #28.
#
# Plus: integratietests tegen een verse compose-stack (Issue #62) en
# validatie van publiccode.yml (Issue #56).
#
# Volgende stappen die hier nog NIET in zitten (aparte PRs):
#   - Dockerhub push (vereist semver tagging via Issue #27)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Job 1: Unit Tests â€” altijd snel en zonder DB
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Run unit tests
        run: pytest -m unit -v --tb=short

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Job 2: Docker Build Check â€” valideert Dockerfile
  # Bouwt de image maar pushed NIET (geen Dockerhub secrets vereist)
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: unit-tests  # Bouw pas als unit tests slagen

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: d-omnitwin:ci-check
          # Cache layers tussen runs om build-tijd te verkorten
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Job 3: Integratietests â€” verse stack met sample dataset (Issue #62)
  # Start docker-compose.yml (zonder dev-override) met lege volumes, wacht tot
  # alles healthy is en draait pytest -m integration in een wegwerpcontainer op
  # het compose-netwerk. Een startfout van de backend laat deze job falen.
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  integration:
    name: Integratietests (verse stack)
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: omnitwin-ci
      OMNITWIN_HTTP_PORT: "8080"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Maak .env met wegwerpwaarden
        run: |
          cp .env.example .env
          set_env() {
            # Vervang (ook uitgecommentarieerde) KEY=... of voeg toe
            if grep -Eq "^#? ?$1=" .env; then
              sed -i -E "s|^#? ?$1=.*|$1=$2|" .env
            else
              echo "$1=$2" >> .env
            fi
          }
          set_env COMPOSE_FILE docker-compose.yml
          set_env DATABASE_PASSWORD "$(openssl rand -hex 16)"
          set_env DATABASE_SSLMODE prefer
          set_env SECRET_KEY "$(openssl rand -hex 32)"
          set_env ADMIN_API_KEY "$(openssl rand -hex 32)"
          set_env ADMIN_PASSWORD "$(openssl rand -hex 16)"
          set_env LOAD_SAMPLE_DATA true
          grep -E '^(COMPOSE_FILE|LOAD_SAMPLE_DATA|DATABASE_(HOST|PORT|NAME|USER|SSLMODE))=' .env

      - name: Start stack (build + wachten op healthchecks)
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Wacht tot Traefik de backend routeert
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "http://localhost:${OMNITWIN_HTTP_PORT}/health" > /dev/null; then
              echo "backend bereikbaar via Traefik"; exit 0
            fi
            sleep 2
          done
          echo "backend niet bereikbaar via Traefik" >&2; exit 1

      - name: Draai integratietests
        run: |
          docker run --rm --network "${COMPOSE_PROJECT_NAME}_default" \
            -v "$PWD":/app -w /app \
            --env-file .env \
            -e DATABASE_HOST=postgres -e DATABASE_PORT=5432 \
            -e OMNITWIN_BASE_URL=http://traefik \
            -e PYTHONDONTWRITEBYTECODE=1 \
            python:3.11-slim sh -c "pip install -q --root-user-action=ignore pytest requests psycopg2-binary python-dotenv \
              && pytest -p no:cacheprovider -m integration tests/integration"

      - name: Draai browser-e2e-tests (Playwright, docs/testcases)
        run: |
          docker run --rm --network "${COMPOSE_PROJECT_NAME}_default" \
            -v "$PWD":/work -w /work \
            -e OMNITWIN_BASE_URL=http://traefik \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e E2E_EXPECT_TIMEOUT_MS=45000 \
            mcr.microsoft.com/playwright/python:v1.63.0-noble sh -c "pip install -q --root-user-action=ignore -r tests/e2e/requirements.txt \
              && pytest -p no:cacheprovider -m e2e tests/e2e -rs"

      - name: Bewaar e2e-screenshots bij falen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: tests/e2e/artifacts/
          if-no-files-found: ignore

      - name: Toon status en logs bij falen
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps

      - name: Stack opruimen
        if: always()
        run: docker compose down -v --remove-orphans

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Job 4: publiccode.yml valideren met de officiÃ«le parser (Issue #56)
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  publiccode:
    name: publiccode.yml valideren
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Valideer publiccode.yml
        run: docker run --rm -v "$PWD":/data italia/publiccode-parser-go:v5.4.3 -no-network /data/publiccode.yml
