# D-OmniTwin CI Pipeline
#
# Triggert op elke PR naar main en bij directe pushes op main.
# Stap 1 (Bouwen) en Stap 3/unit (Testen) uit Issue #28.
#
# Volgende stappen die hier nog NIET in zitten (aparte PRs):
#   - integration-tests (vereist testcontainers + PostgreSQL/PostGIS)
#   - Dockerhub push (vereist semver tagging via Issue #27)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Unit Tests — altijd snel en zonder DB
  # ──────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Run unit tests
        run: pytest -m unit -v --tb=short

  # ──────────────────────────────────────────────
  # Job 2: Docker Build Check — valideert Dockerfile
  # Bouwt de image maar pushed NIET (geen Dockerhub secrets vereist)
  # ──────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: unit-tests  # Bouw pas als unit tests slagen

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: d-omnitwin:ci-check
          # Cache layers tussen runs om build-tijd te verkorten
          cache-from: type=gha
          cache-to: type=gha,mode=max
