name: Release-images naar Docker Hub

# Bij elke gepubliceerde GitHub-release bouwen we de images en zetten we ze op
# Docker Hub, zoals bij OpenZaakBrug en WebformulierenVerwerker (#126):
#   sudwestfryslan/d-omnitwin      backend (ook db-init en Keycloak-hulpjes)
#   sudwestfryslan/d-omnitwin-db   PostgreSQL + PostGIS + pgvector (db.Dockerfile)
#   sudwestfryslan/d-omnitwin-web  bestanden van viewer en beheeromgeving, nginx (web.Dockerfile, #408)
# Tags: <versie>, <major>.<minor> en latest (alleen bij een gewone release, niet bij
# een pre-release). Vereist de repository-secrets DOCKERHUB_USERNAME en DOCKERHUB_TOKEN.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Bestaande releasetag om (opnieuw) te publiceren, bijv. v0.4.0"
        required: true

permissions:
  contents: read

jobs:
  publiceer:
    name: Publiceer ${{ matrix.naam }}
    # Zelfde runner als de CI (repo-variabele CI_RUNNER), anders GitHub-gehost
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - naam: d-omnitwin
            dockerfile: Dockerfile
            titel: D-OmniTwin backend
          - naam: d-omnitwin-db
            dockerfile: db.Dockerfile
            titel: D-OmniTwin database (PostgreSQL, PostGIS, pgvector)
          - naam: d-omnitwin-web
            dockerfile: web.Dockerfile
            titel: D-OmniTwin web (viewer en beheeromgeving, nginx)
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PRERELEASE: ${{ github.event.release.prerelease || false }}
    steps:
      - name: Controleer secrets
        env:
          GEBRUIKER: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$GEBRUIKER" ] || [ -z "$TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME en DOCKERHUB_TOKEN ontbreken in de repository-secrets."
            exit 1
          fi

      - name: Checkout ${{ env.TAG }}
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Controleer versie
        run: |
          versie="$(tr -d '[:space:]' < VERSION)"
          if [ "v${versie}" != "${TAG%%-*}" ] && [ "v${versie}" != "$TAG" ]; then
            echo "::error::Tag ${TAG} past niet bij VERSION ${versie}."
            exit 1
          fi

      - name: Docker-metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/sudwestfryslan/${{ matrix.naam }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ env.PRERELEASE != 'true' }}
            type=raw,value=latest,enable=${{ env.PRERELEASE != 'true' }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=${{ matrix.titel }}
            org.opencontainers.image.licenses=EUPL-1.2
            org.opencontainers.image.vendor=Gemeente Súdwest-Fryslân

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Inloggen op Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Bouwen en publiceren
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.naam }}
          cache-to: type=gha,mode=max,scope=${{ matrix.naam }}

      - name: Samenvatting
        run: |
          echo "### ${{ matrix.naam }}" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
