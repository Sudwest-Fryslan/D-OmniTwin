# Dependabot: wekelijkse update-PR's voor afhankelijkheden (#58).
#
# Versiesprongen van de basisimages (Python 3.11 -> 3.x, PostgreSQL/PostGIS 15 -> 16+)
# vragen een bewuste keuze (zie #58) en worden hier genegeerd; patches komen wel door.
#
# Patch- en minor-updates worden per ecosysteem gegroepeerd in één PR; majors komen los,
# zodat ze bewust beoordeeld worden.
#
# Let op: Dependabot werkt requirements.txt bij, niet requirements.lock (uv-lock). De image
# installeert uit requirements.lock; een pip-PR verandert dus pas iets na het opnieuw
# genereren van het lockbestand (commando bovenin requirements.lock).

version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Bewust vastgezet: los bijwerken faalt (ResolutionImpossible), starlette 1.x
      # breekt CORSMiddleware. Samen upgraden via #172.
      - dependency-name: fastapi
      - dependency-name: starlette
      - dependency-name: uvicorn

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # db.Dockerfile (#191): PostgreSQL-major blijft 15 (bestaande volumes)
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /admin-panel
    schedule:
      interval: weekly
    groups:
      admin-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Majors wachten op de overstap van Create React App naar Vite (#58):
      # onder CRA/TypeScript 4.9 passen deze niet. Na de Vite-overstap weghalen.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
