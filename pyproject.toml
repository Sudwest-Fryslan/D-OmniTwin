# D-OmniTwin — Python-pakket `omnitwin` (src-layout, #182 fase 2)
#
# De backend staat in src/omnitwin/. Importeerbaar maken:
#   - lokaal:           pip install -e .   (met --no-deps zonder de afhankelijkheden)
#   - Docker-image:     PYTHONPATH=/app/src (zie Dockerfile)
#   - pytest:           pythonpath = ["src"] hieronder
#
# Afhankelijkheden (#129): requirements.txt is de enige bron. [project] leest hem
# dynamisch in; de Docker-image installeert uit requirements.lock (gegenereerd uit
# requirements.txt). ETL-pakketten: requirements-etl.txt. CI: requirements-ci.txt.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnitwin"
description = "D-OmniTwin: digitale spiegel van de fysieke leefomgeving (backend)"
requires-python = ">=3.11"
license = {text = "EUPL-1.2"}
dynamic = ["version", "dependencies"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnitwin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Pakket omnitwin (src/omnitwin) importeerbaar zonder installatie
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

markers = [
    "unit: pure Python, geen database of draaiende server vereist",
    "integration: vereist een PostgreSQL database (lokaal of via testcontainers)",
    "e2e: vereist een draaiende server + Playwright browser",
    "llm: vereist een draaiende stack met een echt LLM-model (LLM_TEST=1)",
]

# Standaard: alleen unit tests. Voeg -m integration toe voor DB-tests.
addopts = "-v --tb=short"

# Lint en opmaak (#129). Lokaal: `ruff check .` (zie AGENTS.md); versie gelijk aan de CI.
[tool.ruff]
target-version = "py311"
line-length = 120
# Alleen Python; geen codeblokken in Markdown (documentatie blijft zoals hij is)
extend-exclude = ["*.md"]

# `ruff format` is op de hele codebase gedraaid (#129, stap 2); de CI controleert het
# met `ruff format --check .`. Die commit staat in .git-blame-ignore-revs.
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Baseline (#129): regels die nog op veel plekken falen staan uit. Aantal = treffers na stap 2.
extend-ignore = [
    "E501",   # 129× regel langer dan 120 (lange strings en commentaar). TODO: met de hand, per bestand
    "B904",   # 76× raise zonder `from` in except. TODO: per geval beoordelen; verandert de foutketen
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI-afhankelijkheden in de standaardwaarde van een parameter zijn bedoeld (B008)
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
    "fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Security",
    "omnitwin.oidc.vereis_rol",
]

[tool.ruff.lint.per-file-ignores]
# Baseline per bestand (#129): bestaande afwijkingen; nieuwe bestanden vallen hier niet onder.
# Wat overblijft kan gedrag veranderen en vraagt een beoordeling per geval. TODO: per bestand
# oplossen en de regel hier weghalen. E402 (imports na een `sys.path`-aanpassing) verdwijnt met
# de package-structuur (`pip install -e .`, #414).
