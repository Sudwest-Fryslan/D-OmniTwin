# D-OmniTwin — dynamische Traefik-configuratie (file provider)
#
# Wordt geladen door docker-compose.yml (--providers.file.filename). Elke router
# zet zelf een van deze middlewares (label traefik.http.routers.<naam>.middlewares):
#   security-headers   backend, web, /api/data (PostgREST) en /api/geo (pg_featureserv)
#   keycloak-headers   /auth (Keycloak, compose-profiel keycloak, #214)
# Daarnaast hebben de routers van /api/data (PostgREST) en /api/geo (pg_featureserv)
#   viewer-toegang     forwardAuth naar de backend (#266, ADR 0009): bij VIEWER_TOEGANG=inloggen
#                      alleen met een sessie of token met rol lezer of beheerder; bij open altijd door,
#                      met de header X-Omnitwin-Toegang voor interne lagen (#254, ADR 0010)
# Een nieuwe router zonder een van beide laat tests/test_traefik_routers.py falen.
# Waarom per router en niet op het entrypoint: een middleware op het entrypoint
# overschrijft de headers van elke router, en Keycloak heeft eigen CSP- en
# frame-regels nodig (zie keycloak-headers).
#
# Deze headers zijn leidend. De FastAPI-middleware in src/omnitwin/main.py zet vergelijkbare
# headers als terugval voor `python run_dev.py` zonder Traefik; Traefik
# overschrijft ze.
#
# Bronnen in de CSP (zie docs/9-beheer/installatie.md, Beveiliging):
#   (bibliotheken en lettertype staan zelf gehost in static/vendor, #117: geen CDN's)
#   api.pdok.nl                   BRT-achtergrondkaart: stijl, tegels, sprites, fonts
# 'unsafe-inline' is nodig voor de inline scripts, event-handlers (onclick=)
# en style-attributen in templates/index.html en de Swagger-pagina.
# 'wasm-unsafe-eval' is nodig voor WebAssembly in de kaartbibliotheken; het
# bredere 'unsafe-eval' (eval/new Function) is niet nodig.
# Getest met Playwright: hoofdpagina, kaart, Kompas, /admin, /docs en
# /static/help.html laden zonder CSP-schendingen. Breekt een wijziging iets,
# zet dan tijdelijk contentSecurityPolicyReportOnly in plaats van
# contentSecurityPolicy en kijk in de browserconsole.
http:
  middlewares:
    security-headers:
      headers:
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: true
        customResponseHeaders:
          # Verouderd XSS-filter van oude browsers uitzetten (OWASP-advies)
          X-XSS-Protection: "0"
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
        contentSecurityPolicy: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval';
          style-src 'self' 'unsafe-inline';
          font-src 'self' data:;
          img-src 'self' data: blob: https://api.pdok.nl https://service.pdok.nl;
          connect-src 'self' https://api.pdok.nl https://service.pdok.nl;
          worker-src 'self' blob:;
          child-src 'self' blob:;
          frame-src 'self';
          frame-ancestors 'none';
          object-src 'none';
          base-uri 'self';
          form-action 'self'
        # HSTS: Traefik stuurt deze header alleen op HTTPS-verbindingen die
        # Traefik zelf afhandelt (zie deploy/traefik/tls.example.yml). Op de
        # standaardinstallatie (HTTP) verschijnt hij dus niet. Staat er een
        # TLS-proxy van de organisatie vóór Traefik, dan zet die proxy HSTS.
        stsSeconds: 31536000
        stsIncludeSubdomains: false

    # Toegang tot de data-API's (#266, ADR 0009). Traefik stuurt de headers van het verzoek (cookie,
    # Authorization) naar de backend; 2xx = door, anders gaat het antwoord van de backend (401/403,
    # Problem Details) naar de browser. De backend beslist op VIEWER_TOEGANG (open = altijd 204), zodat
    # er maar één schakelaar is. `backend` is de servicenaam in het compose-netwerk van het project.
    # Staat de backend niet, dan geven /api/data en /api/geo een fout: dicht bij twijfel.
    #
    # Toegang per laag en bron (#254, ADR 0010): bij 204 zet de backend X-Omnitwin-Toegang (intern of
    # openbaar). Traefik kopieert die naar het verzoek aan PostgREST en verwijdert een gelijknamige
    # header van de client eerst, zodat een bezoeker zich niet zelf intern kan maken. De views in
    # schema api filteren daarop (db/migraties/R__api_rollen.sql).
    viewer-toegang:
      forwardAuth:
        address: "http://backend:8000/api/viewer/toegang"
        authResponseHeaders:
          - "X-Omnitwin-Toegang"

    # Pagina's van de web-container achter dezelfde toegang (#408): /rapport. Zelfde endpoint met
    # ?pagina=1: niet ingelogd gaat naar het inloggen (302), zonder rol naar "Geen toegang" (403).
    # De pagina van de viewer (/) serveert de backend zelf, met dezelfde controle in de backend.
    viewer-pagina:
      forwardAuth:
        address: "http://backend:8000/api/viewer/toegang?pagina=1"

    # Keycloak (/auth): zonder CSP, X-Frame-Options en Referrer-Policy. Die zet Keycloak
    # zelf per realm (Realm settings > Security defenses), standaard
    # "frame-src 'self'; frame-ancestors 'self'; object-src 'none'", SAMEORIGIN en
    # no-referrer (strenger dan hierboven: geen code of state in de Referer).
    # De admin-console en keycloak-js gebruiken iframes op hetzelfde adres
    # (sessiecontrole); frame-ancestors 'none' en DENY uit security-headers breken die.
    keycloak-headers:
      headers:
        contentTypeNosniff: true
        customResponseHeaders:
          X-XSS-Protection: "0"
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
        stsSeconds: 31536000
        stsIncludeSubdomains: false
