# Security-headers van de web-container (#408). Terugval, zoals de middleware in de backend
# (src/omnitwin/main.py): achter de gateway zet Traefik security-headers@file
# (deploy/traefik/dynamic.yml), die deze waarden overschrijft. De CSP is gelijk aan die van Traefik;
# tests/test_web_container.py bewaakt dat.
#
# In elke location met een eigen add_header opnieuw includen: nginx erft add_header niet als een
# location er zelf een heeft.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-XSS-Protection "0" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://api.pdok.nl https://service.pdok.nl; connect-src 'self' https://api.pdok.nl https://service.pdok.nl; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
