# D-OmniTwin web-container (#408): de bestanden van de viewer (/static) en de beheeromgeving
# (/admin, /rapport). Alleen statische bestanden en generiek: geen omgevingsconfig, geen data.
# De pagina van de viewer (/) en alle API's serveert de backend; de gateway (Traefik) verdeelt de
# paden en doet de toegangscontrole (forwardAuth op /rapport). Zie deploy/kubernetes/README.md.
#
# Cachebeleid gelijk aan src/omnitwin/statisch.py (#246): een versie of hash in het pad = een jaar,
# immutable; de rest no-cache (opnieuw valideren met de ETag, ongewijzigd een 304).
# tests/test_web_container.py bewaakt dat.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Relatieve Location-headers: achter de gateway kent nginx het publieke adres niet
    absolute_redirect off;
    # Geen toegangslog: daarin stond het IP-adres van de bezoeker (X-Forwarded-For, #264)
    access_log off;
    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json image/svg+xml;

    include /etc/nginx/omnitwin/headers.conf;
    add_header Cache-Control "no-cache" always;

    # ── /static: code, stijl, afbeeldingen en de build van de beheeromgeving ──
    location /static/ {
        try_files $uri =404;
    }

    # cache: onveranderlijk (vendor/<pakket>@<versie>/)
    location ~ "^/static/vendor/[^/]+@[^/]+/" {
        include /etc/nginx/omnitwin/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # cache: onveranderlijk (Vite-assets van de beheeromgeving, met hash in de naam)
    location ~ "^/static/admin-panel/assets/[^/]+-[A-Za-z0-9_-]{8,}\.[a-z0-9]+$" {
        include /etc/nginx/omnitwin/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── Beheeromgeving (React-SPA) en rapporten (#290) ──
    # Oude deeplinks /admin/rapport/... naar /rapport/..., met de query
    location ~ "^/admin/rapport(?<rest>/.*)?$" {
        return 307 /rapport$rest$is_args$args;
    }

    # Bestanden in de root van de build (manifest.json, favicon.ico, ...); anders de SPA
    location = /admin {
        try_files /static/admin-panel/index.html =404;
    }
    location ~ "^/admin/(?<bestand>.*)$" {
        try_files /static/admin-panel/$bestand /static/admin-panel/index.html;
    }

    # Rapporten: de SPA. Toegang als de viewer: forwardAuth in de gateway (router rapport)
    location ~ "^/rapport(/.*)?$" {
        try_files /static/admin-panel/index.html =404;
    }

    # security.txt (RFC 9116)
    location = /.well-known/security.txt {
        try_files /static/.well-known/security.txt =404;
    }

    # Al het andere hoort niet bij deze container
    location / {
        return 404;
    }
}
