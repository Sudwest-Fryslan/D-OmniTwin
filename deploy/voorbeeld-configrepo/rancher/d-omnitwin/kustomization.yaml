# D-OmniTwin in de configuratierepo van de organisatie: overlay op de manifests uit
# https://github.com/Sudwest-Fryslan/D-OmniTwin (map deploy/kubernetes). Zie README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: d-omnitwin

resources:
  # Gevendorde kopie van deploy/kubernetes op een release-tag (opdracht in README.md).
  # Fleet haalt geen remote bases op; daarom staat de base in deze repo.
  - base
  # Zonder Fleet (kubectl apply -k, Argo CD, Flux) kan het ook rechtstreeks, zodra de repo publiek is:
  # - https://github.com/Sudwest-Fryslan/D-OmniTwin//deploy/kubernetes?ref=v0.6.1

# Versie van de images: dezelfde als de tag van de base
images:
  - name: sudwestfryslan/d-omnitwin
    newTag: "0.6.1"
  - name: sudwestfryslan/d-omnitwin-web
    newTag: "0.6.1"
  - name: sudwestfryslan/d-omnitwin-db
    newTag: "0.6.1"

# Instellingen: alleen wat afwijkt van base/01-configmap.yaml. Geheimen staan in de Secret
# omnitwin-secrets (met de hand aangemaakt, zie README.md), nooit hier.
configMapGenerator:
  - name: omnitwin-config
    namespace: d-omnitwin
    behavior: merge
    options:
      # Vaste naam: de db-init-Job verwijst ernaar en een Job is niet te wijzigen
      disableNameSuffixHash: true
    literals:
      - OMNITWIN_BASE_URL=https://d-omnitwin.example.nl
      - OMNITWIN_OMGEVING=productie
      - LOAD_SAMPLE_DATA=false
      # open = kaart voor iedereen; inloggen = alleen met app-rol lezer of beheerder
      - VIEWER_TOEGANG=open
      # Inloggen via Microsoft Entra ID (app-registratie, zie README.md)
      - OIDC_ISSUER=https://login.microsoftonline.com/<tenant-id>/v2.0
      - OIDC_AUDIENCE=<client-id>
      - OIDC_CLIENT_ID=<client-id>
      - OIDC_SCOPE=offline_access api://<client-id>/toegang
      - OIDC_INTERN_URL=
      # Alleen als terugval voor Ollama; een LiteLLM stel je in bij Beheer > AI Configuratie (README.md)
      - OLLAMA_HOST=http://ollama.example.intern:11434

patches:
  # Ingress: haproxy, TLS via cert-manager, twee hostnamen
  - path: ingress-patch.yaml
  # Fleet maakt de namespace zelf (defaultNamespace); de Secrets staan er al vóór de eerste uitrol
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: d-omnitwin
