# Optioneel: Keycloak als identity provider (zelfde als het compose-profiel keycloak).
# Vooraf (eenmalig, realmimport uit de repo):
#   kubectl -n d-omnitwin create configmap keycloak-realm --from-file=deploy/keycloak/realm-omnitwin.json
# In omnitwin-secrets: KEYCLOAK_DB_PASSWORD en KEYCLOAK_ADMIN_PASSWORD.
# In omnitwin-config: OIDC_ISSUER=https://<host>/auth/realms/omnitwin en
#   OIDC_INTERN_URL=http://keycloak:8080/auth/realms/omnitwin
# De inlogthema's (deploy/keycloak/themes) zitten hier niet in: Keycloak gebruikt dan zijn standaardthema.
---
# Database en rol keycloak in dezelfde PostgreSQL (idempotent)
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-db-init-0-6-0
  namespace: d-omnitwin
  labels:
    app.kubernetes.io/name: keycloak-db-init
    app.kubernetes.io/part-of: d-omnitwin
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-db-init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak-db-init
          image: sudwestfryslan/d-omnitwin:0.6.0
          imagePullPolicy: IfNotPresent
          args: ["keycloak-db"]
          envFrom:
            - configMapRef: { name: omnitwin-config }
            - secretRef: { name: omnitwin-secrets }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: d-omnitwin
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: d-omnitwin
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: d-omnitwin
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: d-omnitwin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: d-omnitwin
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.0
          imagePullPolicy: IfNotPresent
          args: ["start", "--import-realm"]
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://postgres:5432/keycloak" }
            - { name: KC_DB_USERNAME, value: keycloak }
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: omnitwin-secrets, key: KEYCLOAK_DB_PASSWORD }
            # Alleen HTTP, achter Traefik en de ingress
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_HTTP_RELATIVE_PATH, value: /auth }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            # Publiek adres; de tokens krijgen deze issuer
            - name: KC_HOSTNAME
              valueFrom:
                configMapKeyRef: { name: omnitwin-config, key: OMNITWIN_BASE_URL }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_METRICS_ENABLED, value: "true" }
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: omnitwin-secrets, key: KEYCLOAK_ADMIN_PASSWORD }
            # Redirect-URI van client omnitwin-web in de realmimport
            - name: OMNITWIN_BASE_URL
              valueFrom:
                configMapKeyRef: { name: omnitwin-config, key: OMNITWIN_BASE_URL }
          ports:
            - containerPort: 8080
            - containerPort: 9000
          readinessProbe:
            httpGet: { path: /auth/health/ready, port: 9000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /auth/health/live, port: 9000 }
            initialDelaySeconds: 120
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { cpu: "2", memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
---
# Route /auth in de Traefik-gateway (60-traefik.yaml leest deze ConfigMap als hij bestaat)
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-keycloak
  namespace: d-omnitwin
data:
  keycloak.yml: |
    http:
      routers:
        keycloak:
          rule: "PathPrefix(`/auth`)"
          entryPoints: [web]
          # Eigen headers: Keycloak zet zelf CSP en X-Frame-Options
          middlewares: [keycloak-headers]
          service: keycloak
      services:
        keycloak:
          loadBalancer:
            servers: [{ url: "http://keycloak:8080" }]
