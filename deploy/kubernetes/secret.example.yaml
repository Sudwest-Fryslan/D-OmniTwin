# VOORBEELD — niet uitrollen. Alleen de sleutels, zonder waarden.
# De echte Secret staat in de interne configuratierepo van de organisatie (versleuteld,
# bijv. met Sealed Secrets of SOPS) of wordt met de hand aangemaakt:
#
#   kubectl -n d-omnitwin create secret generic omnitwin-secrets \
#     --from-literal=DATABASE_PASSWORD=$(openssl rand -hex 24) \
#     --from-literal=ADMIN_PASSWORD=$(openssl rand -hex 24)
#
# Alleen letters en cijfers gebruiken: het databasewachtwoord komt ook in verbindings-URL's.
# Dit bestand staat niet in kustomization.yaml en wordt dus niet uitgerold.
apiVersion: v1
kind: Secret
metadata:
  name: omnitwin-secrets
  namespace: d-omnitwin
type: Opaque
stringData:
  # Verplicht: wachtwoord van de databasegebruiker (ook voor de rollen van PostgREST en pg_featureserv)
  DATABASE_PASSWORD: ""
  # Wachtwoord van het eerste beheeraccount (ADMIN_USER)
  ADMIN_PASSWORD: ""
  # Optioneel: alleen voor scripts (header X-Admin-Key)
  ADMIN_API_KEY: ""
  # Optioneel: LiteLLM-gateway (zelfde waarde in beide)
  LITELLM_MASTER_KEY: ""
  LLM_API_KEY: ""
  # Optioneel: Keycloak (optioneel/keycloak)
  KEYCLOAK_DB_PASSWORD: ""
  KEYCLOAK_ADMIN_PASSWORD: ""
