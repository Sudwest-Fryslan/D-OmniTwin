# PostgREST: data-API op /api/data en /api/data/v1 (via Traefik, zie 60-traefik.yaml).
# Verbindt als rol authenticator en ziet alleen schema api (rollen: db-init, R__api_rollen.sql).
apiVersion: v1
kind: Service
metadata:
  name: postgrest
  namespace: d-omnitwin
  labels:
    app.kubernetes.io/name: postgrest
    app.kubernetes.io/part-of: d-omnitwin
spec:
  selector:
    app.kubernetes.io/name: postgrest
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
  namespace: d-omnitwin
  labels:
    app.kubernetes.io/name: postgrest
    app.kubernetes.io/part-of: d-omnitwin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgrest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgrest
        app.kubernetes.io/part-of: d-omnitwin
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Wachten tot db-init de rollen authenticator en featureserv heeft aangemaakt
        - name: wacht-op-db-init
          image: sudwestfryslan/d-omnitwin:0.5.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              until [ "$(PGPASSWORD="$DATABASE_PASSWORD" psql -h "$DATABASE_HOST" -p "$DATABASE_PORT"
              -U "$DATABASE_USER" -d "$DATABASE_NAME" -tAc
              "SELECT count(*) FROM public.installatie_status" 2>/dev/null)" = "1" ];
              do echo "wachten op db-init"; sleep 5; done
          envFrom:
            - configMapRef: { name: omnitwin-config }
            - secretRef: { name: omnitwin-secrets }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: postgrest
          image: postgrest/postgrest:v16.4
          imagePullPolicy: IfNotPresent
          env:
            # Volgorde telt: $(VAR) gebruikt alleen variabelen die erboven staan
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: { name: omnitwin-secrets, key: DATABASE_PASSWORD }
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef: { name: omnitwin-config, key: DATABASE_NAME }
            - name: PGRST_DB_URI
              value: postgres://authenticator:$(DATABASE_PASSWORD)@postgres:5432/$(DATABASE_NAME)
            - name: PGRST_DB_SCHEMAS
              value: api
            - name: PGRST_DB_ANON_ROLE
              value: web_anon
            # Hoogstens zoveel rijen per antwoord
            - name: PGRST_DB_MAX_ROWS
              value: "10000"
            - name: PGRST_SERVER_PROXY_URI
              value: http://localhost/api/data
          ports:
            - containerPort: 3000
          readinessProbe:
            tcpSocket: { port: 3000 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
