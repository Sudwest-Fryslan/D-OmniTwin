# D-OmniTwin — basis-compose (installatie)
#
#   Installatie (externe organisatie): docker compose -f docker-compose.yml up -d
#   Ontwikkelen:                       docker compose up -d
#     (laadt automatisch docker-compose.override.yml: bind-mount van de repo,
#      databasepoort 5433 en Traefik-dashboard op 8081)
#
# Opstartvolgorde: postgres (healthy) -> db-init (eenmalig, klaar) -> backend,
# postgrest en pg_featureserv. db-init maakt bij een lege database het schema,
# de pg_featureserv-views, de sample-/stuurdata en de admin-gebruiker aan; bij een
# bestaande database slaat hij dat over. Daarna werkt hij altijd de rollen en het
# schema api voor PostgREST en pg_featureserv bij (#57) en stopt. De backend
# initialiseert zelf niets (zie docker-entrypoint.sh), dus meerdere
# backend-replicas racen niet.
#
# Poort: Traefik luistert op de host op ${OMNITWIN_HTTP_PORT:-80}.
name: "d-omnitwin"
services:
  traefik:
    image: traefik:v3.7.13
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Alleen containers van dit compose-project; anders botsen routers met
      # een tweede stack (ander projectnaam) op dezelfde Docker-host
      - "--providers.docker.constraints=Label(`com.docker.compose.project`,`${COMPOSE_PROJECT_NAME:-d-omnitwin}`)"
      - "--providers.docker.network=${COMPOSE_PROJECT_NAME:-d-omnitwin}_default"
      - "--entrypoints.web.address=:80"
      # Security-headers (CSP, nosniff, ...) op alle routes; zie deploy/traefik/dynamic.yml
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.http.middlewares=security-headers@file"
    environment:
      - DOCKER_API_VERSION=1.44
    ports:
      - "${OMNITWIN_HTTP_PORT:-80}:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./deploy/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro"
    restart: unless-stopped

  postgres:
    build:
      context: .
      dockerfile: db.Dockerfile
    environment:
      POSTGRES_USER: ${DATABASE_USER:-omnitwin_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-omnitwin_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Via TCP (-h localhost): tijdens de eerste initdb luistert postgres alleen op de socket
      test: ["CMD-SHELL", "pg_isready -h localhost -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  db-init:
    # Eenmalige initialisatie met de backend-image; stopt na afloop (exit 0)
    build: .
    command: ["init"]
    env_file:
      - .env
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: .
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/`)"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    env_file:
      - .env
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  postgrest:
    image: postgrest/postgrest:v16.4
    # Eigen rollen (#57): verbindt als authenticator, voert verzoeken uit als web_anon en
    # ziet alleen schema api (views en functies). Rollen en wachtwoord: db-init
    # (docker-entrypoint.sh, migrations/schema_v23_api_rollen.sql).
    environment:
      PGRST_DB_URI: postgres://authenticator:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME:-omnitwin_db}
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_SERVER_PROXY_URI: http://localhost/api/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.postgrest.rule=PathPrefix(`/api/data`)"
      - "traefik.http.middlewares.postgrest-strip.stripprefix.prefixes=/api/data"
      - "traefik.http.routers.postgrest.middlewares=postgrest-strip"
      - "traefik.http.services.postgrest.loadbalancer.server.port=3000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  pg_featureserv:
    # Geen semver-tags op Docker Hub; datumtag van de huidige release
    image: pramsey/pg_featureserv:20250917
    # Alleen-lezen rol featureserv (#57): ziet alleen vw_gebieden_features,
    # omgevingsvisie_deelgebieden en de postgisftw-functies
    environment:
      DATABASE_URL: postgres://featureserv:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME:-omnitwin_db}
      PGFS_SERVER_BASEPATH: /api/geo
      PGFS_PAGING_LIMITMAX: 10000
      PGFS_PAGING_LIMITDEFAULT: 10000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pg_featureserv.rule=PathPrefix(`/api/geo`)"
      - "traefik.http.services.pg_featureserv.loadbalancer.server.port=9000"
    depends_on:
      # Na db-init, zodat pg_featureserv de views bij het starten ziet
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  llm-gateway:
    # Optionele LiteLLM-gateway (ADR 0001): alleen met `--profile llm-gateway`.
    # Alleen intern bereikbaar (geen hostpoort); de backend gebruikt
    # http://llm-gateway:4000 met llm_config.api_type=openai.
    image: ghcr.io/berriai/litellm:v1.103.1
    profiles: ["llm-gateway"]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      LITELLM_DEFAULT_MODEL: ollama_chat/${OLLAMA_MODEL:-qwen3:30b}
      # Optioneel: sleutels voor externe aanbieders (alleen in .env; leeg = alias niet bruikbaar)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - "./deploy/litellm/config.yaml:/app/config.yaml:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  pgdata:
