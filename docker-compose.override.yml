# D-OmniTwin — dev-aanvulling op docker-compose.yml
#
# Wordt automatisch geladen bij `docker compose up`. Niet gebruiken voor een
# installatie; daarvoor: `docker compose -f docker-compose.yml up -d`.
services:
  traefik:
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.constraints=Label(`com.docker.compose.project`,`${COMPOSE_PROJECT_NAME:-d-omnitwin}`)"
      - "--providers.docker.network=${COMPOSE_PROJECT_NAME:-d-omnitwin}_default"
      - "--entrypoints.web.address=:80"
      # Headers-middlewares per router; zie docker-compose.yml en deploy/traefik/dynamic.yml
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
    ports:
      - "8081:8080"   # Traefik-dashboard

  postgres:
    ports:
      - "5433:5432"   # voor scripts en tools op de host (DATABASE_HOST=localhost, DATABASE_PORT=5433)

  db-init:
    volumes:
      - .:/app        # code en init-scripts van de host in plaats van die uit de image

  backend:
    volumes:
      - .:/app        # code van de host in plaats van die uit de image
                      # (het embeddingmodel staat buiten /app, in /opt/models: blijft zichtbaar)
      - backend-logs:/app/logs   # eigen volume: logs/ op de host is niet altijd schrijfbaar voor de niet-root app-gebruiker (Windows)
      # data-upload/ zit ook in dev in het volume uploads (docker-compose.yml), niet in de repomap

  keycloak-db-init:
    volumes:
      - .:/app        # entrypoint van de host

  keycloak:
    # Alleen met het profiel keycloak. Dev-modus: geen hostname-controle, caches lokaal.
    # Bereikbaar via Traefik op http://localhost/auth
    command: ["start-dev", "--import-realm"]

volumes:
  backend-logs:
